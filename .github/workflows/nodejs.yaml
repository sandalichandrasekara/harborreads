name: Node.js CI

on:
  workflow-dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      API_KEY: ${{ secrets.API_KEY }}

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
         node-version: '20.x'
         cache: 'npm'
         cache-dependency-path: "./backend"

    - run: npm run build --if-present
      working-directory: ./backend